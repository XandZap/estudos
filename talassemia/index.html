<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Talassemia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Great+Vibes&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: placa do item + cronômetro no topo, mídia à esquerda, enunciado e perguntas à direita; empilha no celular */
:root{
  --pamt:100%;
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --ink:#14201E; --muted:#56635F; --line:#CDD6D3;
  --primary:#9B1C2E; --primary-ink:#FFFFFF; --primary-soft:#FBE6E9;
  --alert:#B42318; --alert-soft:#FBE4E1; --ok:#1C7A3B; --ok-soft:#DDF1E3; --warn:#9A5800; --warn-soft:#FBEBD3;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#162120; --sunk:#1D2A28; --ink:#E4EDEB; --muted:#93A39F; --line:#2B3936;
  --primary:#F27485; --primary-ink:#2B070D; --primary-soft:#3D161D;
  --alert:#F2705E; --alert-soft:#3D1D1A; --ok:#5DC48A; --ok-soft:#173623; --warn:#E6A24A; --warn-soft:#3A2A12; --pamt:20%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --sunk:#1D2A28; --ink:#E4EDEB; --muted:#93A39F; --line:#2B3936;
  --primary:#F27485; --primary-ink:#2B070D; --primary-soft:#3D161D;
  --alert:#F2705E; --alert-soft:#3D1D1A; --ok:#5DC48A; --ok-soft:#173623; --warn:#E6A24A; --warn-soft:#3A2A12; --pamt:20%; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-size:clamp(30px,5vw,44px);line-height:1;text-transform:uppercase}
.brand p{margin:4px 0 0;color:var(--muted);font-size:15px}
.author{display:flex;align-items:baseline;gap:8px;margin-top:6px;color:var(--primary)}
.author small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.author span{font-family:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;font-size:clamp(28px,4vw,36px);line-height:1}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.setup{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.setup h2{font-size:28px;text-transform:uppercase;margin-bottom:6px}
.muted{color:var(--muted)}
.field{margin-top:16px}
.field label.l{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn{border:0;background:var(--primary);color:var(--primary-ink);padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rules{margin:0;padding-left:18px;display:grid;gap:6px}
.rules li::marker{color:var(--primary)}
/* station */
.stationbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.placard{font-family:var(--display);font-weight:700;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:6px;font-size:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.progress{flex:1;min-width:140px;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s}
.timer{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:110px;justify-content:flex-end}
.timer svg{width:38px;height:38px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .bgc{stroke:var(--sunk)} .timer .fg{stroke:var(--primary);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low{color:var(--alert)} .timer.low .fg{stroke:var(--alert)}
.station{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.station{grid-template-columns:1fr}}
.gallery{display:grid;gap:8px;background:var(--sunk);padding:8px;border-radius:var(--r)}
.gallery.two{grid-template-columns:1fr 1fr}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;max-height:440px;object-fit:contain;display:block;border-radius:6px;background:#000;cursor:zoom-in}
.gallery.two img{max-height:300px}
.labcard{background:var(--surface);border-radius:6px;padding:16px;font-variant-numeric:tabular-nums}
.labcard h3{font-size:20px;text-transform:uppercase;margin-bottom:8px}
.labcard table{width:100%;border-collapse:collapse;font-size:15px}
.labcard td{padding:6px 4px;border-bottom:1px dashed var(--line)}
.labcard td:last-child{text-align:right;color:var(--muted)}
.labcard .flag{color:var(--alert);font-weight:700}
.zoomhint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.case{display:grid;gap:14px;min-width:0}
.case .who{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary)}
.case .story{font-size:17px;margin:0}
.q{border-top:1px solid var(--line);padding-top:12px}
.q p{margin:0 0 8px;font-weight:700}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:8px;cursor:pointer;line-height:1.35}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .k{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)} .opt.wrong .k{background:var(--alert);border-color:var(--alert);color:var(--surface)}
.opt:disabled{cursor:default}
.why{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:15px;margin-top:8px}
.why b{color:var(--primary)}
.look{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:40}
/* result */
.score{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.big{font-family:var(--display);font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.verdict{flex:1;min-width:240px}
.review{display:grid;gap:12px;margin-top:18px}
.rv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:var(--r);padding:12px}
.rv.bad{border-left-color:var(--alert)}
.rv img{width:120px;height:100px;object-fit:cover;border-radius:6px}
.rv h3{font-size:20px;text-transform:uppercase}
.rv ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.rv .y{color:var(--alert)} .rv .c{color:var(--ok);font-weight:600}
@media (max-width:520px){.rv{grid-template-columns:1fr}.rv img{width:100%;height:160px}}
/* atlas */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:190px;object-fit:cover;cursor:zoom-in;background:#000}
.card .cb{padding:10px 12px;display:grid;gap:4px}
.card .dz{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase}
.card .cap{font-size:14px;color:var(--muted)}
.card .reveal{border:1px dashed var(--primary);background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:8px;font-weight:700;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:8px;margin-left:auto;font-weight:600;font-size:14px;cursor:pointer}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:22px}
.sheet .panel{padding:14px}
.sheet h3{font-size:22px;text-transform:uppercase;margin-bottom:6px}
.sheet ul{margin:0;padding-left:18px;font-size:15px;display:grid;gap:3px}
.sheet .tx{margin-top:8px;font-size:14px;background:var(--sunk);padding:6px 8px;border-radius:6px}
/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,10,9,.92);display:grid;place-items:center;z-index:50;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));background:#fff;color:#111;border:0;border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
/* celular: barra do item fixa, cabeçalho compacto */
.stationbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
.hist{display:grid;gap:6px;margin-top:10px;font-variant-numeric:tabular-nums}
.hist .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0;font-size:15px}
.weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.weak span{background:var(--alert-soft);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600}
.chip.err{border-color:var(--alert)}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
@media (max-width:600px){
  .brand h1{font-size:28px}.brand p{display:none}
  .top{align-items:center}
  .placard{font-size:18px;padding:4px 10px}
  .timer{font-size:26px;min-width:0;margin-left:auto}
  .progress{display:none}
  .stationbar{flex-wrap:nowrap;gap:10px}
  .case .story{font-size:16px}
  .opt{padding:12px}
  .gallery img{max-height:300px}
}
/* 80/20 */
.hy-intro{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;margin-bottom:14px}
.hy-intro h2{font-size:clamp(30px,5vw,40px);text-transform:uppercase}
.hy-sec{margin-top:26px}
.hy-sec>h2{font-size:26px;text-transform:uppercase;margin-bottom:4px}
.hy-sec>p{margin:0 0 12px}
.rules20{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:r}
.rules20 li{counter-increment:r;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rules20 li::before{content:counter(r,decimal-leading-zero);font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.rules20 b{display:block;font-size:17px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:400px){.pairs{grid-template-columns:1fr}}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.pair h3{font-size:20px;text-transform:uppercase;margin-bottom:8px}
.pair .vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pair .side{background:var(--sunk);border-radius:8px;padding:10px;font-size:14px}
.pair .side strong{display:block;font-size:15px;margin-bottom:2px}
.pair .key{margin:10px 0 0;font-size:14px;color:var(--muted)}
.pair .key b{color:var(--ink)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:400px){.dcards{grid-template-columns:1fr}}
.dcard .sig{font-weight:700;color:var(--alert)}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:110px minmax(0,1fr)}
.dcard img{width:110px;height:100%;min-height:150px;object-fit:cover;cursor:zoom-in;background:#000}
.dcard .nolab{display:grid;place-items:center;text-align:center;background:var(--sunk);font-size:13px;font-weight:700;padding:8px;color:var(--muted)}
.dcard .db{padding:10px 12px;display:grid;gap:4px;font-size:14px}
.dcard h3{font-size:21px;text-transform:uppercase}
.dcard .ag{color:var(--muted);font-size:13px}
.dcard .tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--alert);color:var(--surface);margin-right:4px}
.dcard .tag.b{background:var(--primary);color:var(--primary-ink)}
.dcard .cd{background:var(--sunk);border-radius:6px;padding:6px 8px;margin-top:2px}
/* cards estilo nota de estudo, um tom pastel por doença */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
@media (max-width:400px){.notes{grid-template-columns:1fr}}
.ncard{background:color-mix(in srgb,var(--p) var(--pamt),var(--surface));border:1px solid color-mix(in srgb,var(--d) 35%,transparent);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.ncard .nh{display:flex;gap:10px;align-items:center}
.ncard .nh img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none;cursor:zoom-in;border:2px solid color-mix(in srgb,var(--d) 40%,transparent)}
.ncard .nh .ph{width:58px;height:58px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;text-align:center;line-height:1.1;background:color-mix(in srgb,var(--d) 15%,transparent)}
.ncard h3{font-size:25px;text-transform:uppercase;line-height:1;color:var(--hd)}
.ncard dl{margin:0;display:grid;gap:6px}
.ncard dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--hd)}
.ncard dd{margin:0;font-size:14.5px;line-height:1.35}
.ncard .att{background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:8px;padding:7px 9px;font-size:14px;font-weight:600}
.ncard .att::before{content:"Atenção  ";font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--alert)}
.ncard{--hd:var(--d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ncard{--hd:var(--p)}}
:root[data-theme="dark"] .ncard{--hd:var(--p)}
.ddif{background:color-mix(in srgb,var(--p) calc(var(--pamt) * .5),var(--surface));border:1px solid color-mix(in srgb,var(--d) 30%,var(--line));border-radius:10px;padding:10px 12px}
.ddif h4{font-family:var(--display);font-size:18px;text-transform:uppercase;margin:0 0 4px;color:var(--hd)}
.ddif ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14.5px;line-height:1.4}
.dbody{display:grid;gap:14px}
.dbody[hidden],.dans[hidden]{display:none!important}
.dans{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:14px}
.dstudy{margin:0 0 12px;display:inline-flex}
/* resumo definitivo: páginas */
.dnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.dpage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px;scroll-margin-top:calc(12px + env(safe-area-inset-top,0px));display:grid;gap:16px}
.dpage.duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dpage.duo .dfoot{grid-column:1/-1}
@media (max-width:820px){.dpage.duo{grid-template-columns:1fr}}
.dsheet{display:grid;gap:14px;min-width:0}
.dsheet.half+.dsheet.half{border-left:1px dashed var(--line);padding-left:16px}
@media (max-width:820px){.dsheet.half+.dsheet.half{border-left:0;padding-left:0;border-top:1px dashed var(--line);padding-top:16px}}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--p) var(--pamt),var(--surface));border-radius:10px;padding:10px 14px}
.dhead h3{font-size:clamp(28px,4vw,38px);text-transform:uppercase;line-height:1;color:var(--hd)}
.dsheet{--hd:var(--d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dsheet{--hd:var(--p)}}
:root[data-theme="dark"] .dsheet{--hd:var(--p)}
.dimgs{display:grid;gap:10px}
.dimgs.two{grid-template-columns:1fr 1fr}
@media (max-width:520px){.dimgs.two{grid-template-columns:1fr}}
.dimgs figure{margin:0;display:grid;gap:4px}
.dimgs img{width:100%;height:260px;object-fit:cover;object-position:center 25%;border-radius:10px;background:#000;cursor:zoom-in}
.dsheet.half .dimgs img{height:220px}
.dimgs figcaption{font-size:13px;color:var(--muted)}
.dlab{background:var(--sunk);border-radius:10px;padding:14px;font-variant-numeric:tabular-nums}
.dlab table{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.dlab td{padding:5px 2px;border-bottom:1px dashed var(--line)}
.dlab td:last-child{text-align:right}
.dlab .flag{color:var(--alert);font-weight:700}
.dlab small{display:block;margin-top:8px;color:var(--muted)}
.dcase{border:1px solid color-mix(in srgb,var(--d) 40%,var(--line));border-left:5px solid var(--hd);border-radius:10px;padding:12px 14px;background:color-mix(in srgb,var(--p) calc(var(--pamt) * .35),var(--surface))}
.dcase .dl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--hd)}
.dcase p{margin:6px 0 0;font-size:16px;line-height:1.5}
.dcase .dq{font-size:15px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.dsheet.half .dgrid{grid-template-columns:1fr}
.df{background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.df h4,.dprof h4{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;color:var(--hd)}
.df ul,.dprof ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:14.5px;line-height:1.4}
.dprof{background:var(--alert-soft);border:1px solid color-mix(in srgb,var(--alert) 35%,transparent);border-radius:10px;padding:10px 12px}
.dprof h4{color:var(--alert)}

const timed=()=>run&&run.mode==='prova'&&cfg.mode!=='none';
function startTimer(){
  stopTimer();if(!timed())return;
  tick=setInterval(()=>{run.left--;updateTimer();if(run.left===10)beep(660);if(run.left<=0)beep(440,.4);
    if(run.left<=0){stopTimer();run.locked=true;
      if(cfg.mode==='total'){toast('Tempo esgotado: prova encerrada');setTimeout(finish,1200)}
      else{toast('Tempo esgotado: próximo item');setTimeout(next,1200)}}},1000);
}
function startStation(){
  const keep=timed()&&cfg.mode==='total'&&run.i>0;   // no tempo total o relógio não reinicia a cada item
  if(!keep)stopTimer();
  run.locked=false;run.checked=false;
  if(!(run.mode==='prova'&&cfg.mode==='total'))run.left=cfg.t;
  render();window.scrollTo({top:0});
  if(timed()&&!keep)startTimer();
}
function updateTimer(){
  const el=$('timer');if(!el)return;const tot=cfg.mode==='total'?cfg.tt:cfg.t,t=Math.max(0,run.left),m=Math.floor(t/60),s=String(t%60).padStart(2,'0');
  el.querySelector('span').textContent=`${m}:${s}`;const C=2*Math.PI*16;el.querySelector('.fg').style.strokeDashoffset=C*(1-t/tot);el.classList.toggle('low',t<=10);
}
function finish(){stopTimer();run.done=true;render();window.scrollTo({top:0})}
function next(){if(run.i<run.stations.length-1){run.i++;startStation()}else finish()}
function tableHTML(t){return `<div class="gallery"><div class="labcard"><h3>${esc(t.title)}</h3><table>${t.rows.map(r=>`<tr><td>${esc(r[0])}</td><td ${r[3]?'class="flag"':''}>${esc(r[1])}</td><td>${esc(r[2]||'')}</td></tr>`).join('')}</table>${t.note?`<p class="zoomhint">${esc(t.note)}</p>`:''}</div></div>`}
function stationMedia(s){
  let h='';
  if(s.table)h+=tableHTML(s.table);
  if(s.imgs&&s.imgs.length){const two=s.imgs.length>1;h+=`<div class="gallery ${two?'two':''}">${s.imgs.map((n,k)=>`<figure>${tagImg(n,'Imagem '+(k+1)+' do item','loading="eager"')}</figure>`).join('')}</div><p class="zoomhint">Toque na imagem para ampliar.</p>`}
  return h;
}
function discFb(q,qi){
  return `<div class="why"><b>Resposta-modelo:</b> ${q.model||''}</div><div class="chk"><p class="muted">Marque o que a sua resposta trouxe:</p>${chkList(q).map((c,i)=>`<label><input type="checkbox" data-sq="${qi}" data-ci="${i}" ${q.self[i]?'checked':''}> <span>${esc(c)}</span></label>`).join('')}</div>`;
}
function renderStation(){
  const st=run.stations[run.i],s=st.s,prova=run.mode==='prova',total=run.stations.length,showFb=!prova&&run.checked;
  const media=stationMedia(s), timer=prova&&cfg.mode!=='none';

    :`<div class="q"><p>${qi+1}. ${esc(q.q)}</p><div class="opts">${q.order.map((o,oi)=>{let cls='';if(showFb){if(o===q.a)cls='right';else if(o===q.pick)cls='wrong'}
      return `<button type="button" class="opt ${cls}" data-q="${qi}" data-o="${oi}" aria-pressed="${q.pick===o}" ${run.locked||showFb?'disabled':''}><span class="k">${'ABCDE'[oi]}</span><span>${esc(o)}</span></button>`}).join('')}</div>
      ${showFb?`<div class="why"><b>${q.pick===q.a?'Certo.':'Errado.'}</b> ${esc(q.why||'')}</div>`:''}</div>`;
  app.innerHTML=`<div class="stationbar"><span class="placard">${esc(M.itemLabel)} ${String(run.i+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span>

    ${timer?`<div class="timer" id="timer" role="timer"><svg viewBox="0 0 38 38"><circle class="bgc" cx="19" cy="19" r="16"/><circle class="fg" cx="19" cy="19" r="16" stroke-dasharray="${2*Math.PI*16}" stroke-dashoffset="0"/></svg><span>0:00</span></div>`:''}</div>
  <section class="station" ${media?'':'style="grid-template-columns:1fr"'}>${media?`<div>${media}</div>`:''}
    <div class="case">${s.case||showFb?`<div class="who">${esc(M.caseLabel)} ${showFb?'· '+esc(D[s.topic]||''):''}</div>`:''}${s.case?`<p class="story">${esc(s.case)}</p>`:''}
    ${st.qs.map(qHTML).join('')}
    ${showFb&&s.look?`<div class="look"><b>${esc(M.lookLabel)}:</b> ${esc(s.look)}</div>`:''}
    <div class="actions">${prova?`<button class="btn" id="nx" type="button">${run.i<total-1?'Próximo item':'Entregar prova'}</button>`
      :showFb?`<button class="btn" id="nx" type="button">${run.i<total-1?'Próximo item':'Ver resumo'}</button>`
      :`<button class="btn" id="ck" type="button" ${st.qs.every(answered)?'':'disabled'}>Corrigir</button>`}</div></div></section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const q=st.qs[+b.dataset.q];q.pick=q.order[+b.dataset.o];
    app.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    const ck=$('ck');if(ck)ck.disabled=!st.qs.every(answered)});
  app.querySelectorAll('.ta').forEach(a=>a.oninput=()=>{st.qs[+a.dataset.q].text=a.value});
  app.querySelectorAll('[data-sq]').forEach(c=>c.onchange=()=>{st.qs[+c.dataset.sq].self[+c.dataset.ci]=c.checked});
  const nx=$('nx');if(nx)nx.onclick=next;
  const ck=$('ck');if(ck)ck.onclick=()=>{run.checked=true;renderStation()};
  if(timer)updateTimer();
}
function calc(){
  let pts=0,max=0;
  run.stations.forEach(st=>st.qs.forEach(q=>{max++;pts+=qScore(q)}));
  return {pts,max};
}
function renderResult(){

  run.stations.forEach(st=>{if(st.qs.every(qOK))wrongIds.delete(st.s.id);else wrongIds.add(st.s.id)});store('wrong',[...wrongIds]);
  if(prova){
    const rec={t:run.t0||(run.t0=Date.now()),pts,max,wrong:[...new Set(run.stations.filter(st=>!st.qs.every(qOK)).map(st=>st.s.topic))]};
    if(run.hidx==null){history.push(rec);history=history.slice(-50);run.hidx=history.length-1}else history[run.hidx]=rec;
    store('hist',history)}
  const hasD=run.stations.some(st=>st.qs.some(isD));
  const hi=M.passRules.hi,mid=M.passRules.mid;
  const rvQ=(q,si,qi)=>isD(q)
    ?`<li>${esc(q.q)} <span class="muted">(discursiva · ${Math.round(qScore(q)*100)}%)</span>

      <div class="chk">${chkList(q).map((c,i)=>`<label><input type="checkbox" data-si="${si}" data-qi="${qi}" data-ci="${i}" ${q.self[i]?'checked':''}> <span>${esc(c)}</span></label>`).join('')}</div></li>`
    :`<li>${esc(q.q)} ${q.pick===q.a?`<span class="c">✓ ${esc(q.a)}</span>`:`<span class="y">✗ ${q.pick?esc(q.pick):'em branco'}</span><br><span class="c">Correta: ${esc(q.a)}</span>`}</li>`;
  app.innerHTML=`<section class="panel"><div class="score"><div class="big">${fmt(pts)}<span class="muted" style="font-size:36px">/${max}</span></div>
    <div class="verdict"><h2 style="font-size:30px;text-transform:uppercase">${pct>=hi?'Pronto para a prova':pct>=mid?'Quase lá':'Volte ao material'}</h2><p class="muted" style="margin:4px 0 0">${pct}% de acerto. Abaixo, cada ${esc(IL())} com a resposta e o que observar.${hasD?' Nas discursivas, marque a checklist: a nota atualiza na hora.':''}</p></div>
    <div class="actions"><button class="btn" id="again" type="button">Nova ${prova?'prova':'rodada'}</button>${wrongIds.size?`<button class="btn ghost" id="rev" type="button">Treinar meus erros (${wrongIds.size})</button>`:''}</div></div></section>
  <section class="review">${run.stations.map((st,i)=>{const ok=st.qs.every(qOK),s=st.s;
    return `<article class="rv ${ok?'':'bad'}">${s.imgs&&s.imgs[0]?tagImg(s.imgs[0],''):`<div class="labcard" style="padding:8px;font-size:13px"><b>${esc((s.table&&s.table.title)||M.itemLabel+' '+(i+1))}</b></div>`}
    <div><h3>${esc(M.itemLabel)} ${i+1} · ${esc(D[s.topic]||'')} </h3><ul>${st.qs.map((q,qi)=>rvQ(q,i,qi)).join('')}</ul>
    ${s.look?`<p class="muted" style="margin:6px 0 0;font-size:14px"><b>${esc(M.lookLabel)}:</b> ${esc(s.look)}</p>`:''}</div></article>`}).join('')}</section>`;
  $('again').onclick=()=>{run=null;render()};
  const rv=app.querySelector('#rev');if(rv)rv.onclick=()=>{treinoFilter='erros';$('tab-treino')&&$('tab-treino').click()};
  app.querySelectorAll('[data-si]').forEach(c=>c.onchange=()=>{run.stations[+c.dataset.si].qs[+c.dataset.qi].self[+c.dataset.ci]=c.checked;renderResult()});
  window.scrollTo(0,y);
}

      <div class="actions" style="justify-content:flex-start"><button type="button" class="btn ${open?'ghost':''}" data-toggle="${d.id}">${open?'Ocultar gabarito':'Mostrar gabarito e checklist'}</button></div>

  <section class="atlas">${items.map(([img,dz,cap])=>{const show=!hideNames||revealed.has(img);
    return `<article class="card">${tagImg(img,show?D[dz]+': '+cap:'Imagem para identificar','loading="lazy"')}<div class="cb">${show?`<div class="dz">${esc(D[dz])}</div><div class="cap">${esc(cap)}</div>`:`<button type="button" class="reveal" data-r="${img}">Qual é? Revelar</button>`}</div></article>`}).join('')}</section>
  ${DATA.sheet.length?`<h2 style="font-size:30px;text-transform:uppercase;margin-top:28px">Cola rápida</h2><section class="sheet">${DATA.sheet.map(([k,lines,cd])=>`<div class="panel"><h3>${esc(D[k]||k)}</h3><ul>${lines.map(l=>`<li>${l}</li>`).join('')}</ul>${cd?`<div class="tx"><b>${esc(M.condLabel)}:</b> ${cd}</div>`:''}</div>`).join('')}</section>`:''}`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{atlasFilter=b.dataset.k;renderAtlas()});
  app.querySelector('#hide').onchange=e=>{hideNames=e.target.checked;revealed.clear();renderAtlas()};
  app.querySelectorAll('.reveal').forEach(b=>b.onclick=()=>{revealed.add(b.dataset.r);renderAtlas()});
}

/* ---------- 80/20 ---------- */
function renderResumo(){
  const side=x=>x?`<div class="side"><strong>${x[0]}</strong>${x[1]}</div>`:'';
  const nR=DATA.rules.length;
  app.innerHTML=`<div class="hy-intro"><h2>Resumo 80/20</h2><p class="muted" style="margin:0">O pouco que resolve a maior parte da prova.</p></div>
  ${nR?`<section class="hy-sec"><h2>As ${nR} regras</h2><ol class="rules20">${DATA.rules.map(([t,d])=>`<li><div><b>${t}</b>${d}</div></li>`).join('')}</ol></section>`:''}
  ${DATA.pairs.length?`<section class="hy-sec"><h2>Pares que confundem</h2><p class="muted">Quando duas coisas parecem iguais, decida pelo critério da última linha.</p><div class="pairs">${DATA.pairs.map(p=>`<article class="pair"><h3>${p.t}</h3><div class="vs">${side(p.a)}${side(p.b)}${side(p.c)}</div><p class="key">${p.k}</p></article>`).join('')}</div></section>`:''}
  ${DATA.snaps.length?`<section class="hy-sec"><h2>Um tópico, uma síntese</h2><p class="muted">Visão direta de cada eixo temático para revisão rápida.</p><div class="dcards">${DATA.snaps.map(([k,img,ag,tags,cl,cd])=>`<article class="dcard">${img?tagImg(img,D[k],'loading="lazy"'):`<div class="nolab">${esc(ag)}</div>`}<div class="db"><h3>${esc(D[k]||k)}</h3><div class="ag">${ag}</div>${tags&&tags.length?`<div>${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}<div>${cl}</div><div class="cd"><b>${esc(M.condLabel)}:</b> ${cd}</div></div></article>`).join('')}</div></section>`:''}`;
}

/* ---------- cards ---------- */
function renderCards(){
  const shortTag={fisio:'Fisio',hb:'Hb',alfa:'α-Tal',beta:'β-Tal',clinica:'Clínica',diag:'Diag',trat:'Trat',gen:'Gen'};
  app.innerHTML=`<div class="hy-intro"><h2>Cards</h2><p class="muted" style="margin:0">Um card por tópico, com o essencial e os alertas.</p></div>
  <section class="notes">${DATA.notes.map(([k,img,f,att])=>{const t=DATA.topics[k]||{p:'#eee',d:'#333',name:k};
    return `<article class="ncard" style="--p:${t.p};--d:${t.d}"><div class="nh">${img?tagImg(img,t.name,'loading="lazy"'):`<div class="ph">${esc(shortTag[k]||t.name.split(' ')[0])}</div>`}<h3>${esc(t.name)}</h3></div>
    <dl>${DATA.noteLabels.map((l,i)=>f[i]?`<div><dt>${esc(l)}</dt><dd>${f[i]}</dd></div>`:'').join('')}</dl>${att?`<div class="att">${att}</div>`:''}</article>`}).join('')}</section>`;
}

/* ---------- definitivo ---------- */
const defList=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
let defStudy=false,defOpen=new Set();
function defSheet(o,half){
  const t=DATA.topics[o.k]||{p:'#eee',d:'#333',name:o.k};
  const imgs=o.table?`<div class="dimgs one"><div class="dlab"><b>${esc(o.table.title)}</b><table>${o.table.rows.map(r=>`<tr><td>${esc(r[0])}</td><td ${r[3]?'class="flag"':''}>${esc(r[1])}</td></tr>`).join('')}</table>${o.table.note?`<small>${esc(o.table.note)}</small>`:''}</div></div>`
    :(o.imgs&&o.imgs.length?`<div class="dimgs ${o.imgs.length>1?'two':'one'}">${o.imgs.map(([i,c])=>`<figure>${tagImg(i,c,'loading="lazy"')}<figcaption>${c}</figcaption></figure>`).join('')}</div>`:'');
  const hidden=defStudy&&!defOpen.has(o.k);
  return `<div class="dsheet ${half?'half':''}" style="--p:${t.p};--d:${t.d}"><header class="dhead"><h3>${esc(t.name)}</h3></header>${imgs}
  ${o.case?`<div class="dcase"><div class="dl">${o.practice?'Fora da aula · exemplo de treino':esc(M.caseLabel)}</div><p>${o.case}</p>${o.case2?`<div class="dl" style="margin-top:10px">${esc(M.caseLabel)} 2</div><p>${o.case2}</p>`:''}${o.question?`<p class="dq"><b>Pergunta:</b> ${o.question}</p>`:''}</div>`:''}
  <div class="dans" ${hidden?'':'hidden'}><button type="button" class="btn" data-open="${o.k}">Mostrar resposta</button><span class="muted">Responda de cabeça antes de abrir.</span></div>
  <div class="dbody" ${hidden?'hidden':''}><div class="dgrid">${o.sections.map(([h,a])=>`<section class="df"><h4>${h}</h4>${defList(a)}</section>`).join('')}</div>
  ${o.dif&&o.dif.length?`<section class="ddif"><h4>${esc(M.difLabel)}</h4><ul>${o.dif.map(([n,x])=>`<li><b>${n}:</b> ${x}</li>`).join('')}</ul></section>`:''}
  ${o.alerts&&o.alerts.length?`<section class="dprof"><h4>${o.alertsTitle||'Pontos de atenção'}</h4>${defList(o.alerts)}</section>`:''}</div></div>`;
}
function renderDef(){
  const y=window.scrollY,pages=[],used=new Set();
  DATA.def.forEach(o=>{if(used.has(o.k))return;used.add(o.k);const d=o.duo&&DATA.def.find(x=>x.k===o.duo);if(d)used.add(d.k);pages.push(d?[o,d]:[o])});
  app.innerHTML=`<div class="hy-intro"><h2>Resumo definitivo</h2><p class="muted" style="margin:0">Uma página por tópico: material do professor, complementos das provas e pontos de atenção.</p></div>
  <label class="switch dstudy"><input type="checkbox" id="dstudy" ${defStudy?'checked':''}> Modo estudo: esconder as respostas</label>
  <nav class="dnav">${pages.map((pg,i)=>pg.map(o=>`<button type="button" class="chip" data-go="pg${i}">${esc((DATA.topics[o.k]||{}).name||o.k)}</button>`).join('')).join('')}</nav>
  ${pages.map((pg,i)=>`<article class="dpage ${pg.length>1?'duo':''}" id="pg${i}">${pg.map(o=>defSheet(o,pg.length>1)).join('')}<footer class="dfoot">Página ${i+1} de ${pages.length} · ${esc(M.title)}${M.author?' · '+esc(M.author):''}</footer></article>`).join('')}`;
  const ds=app.querySelector('#dstudy');ds.onchange=()=>{defStudy=ds.checked;defOpen.clear();renderDef()};
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{defOpen.add(b.dataset.open);renderDef()});
  window.scrollTo(0,y);
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>$(b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'}));
}

/* ---------- flashcards com repetição espaçada (caixas de Leitner) ---------- */
const BOX_DAYS=[0,1,3,7,16];
let flashState=load('flash',{}), flashQueue=null, flashShow=false, flashTopic='todos';
function flashId(c,i){return c.id||('f'+i)}
function flashDue(){const now=Date.now();return DATA.flash.map((c,i)=>({c,id:flashId(c,i)})).filter(x=>(flashTopic==='todos'||x.c.topic===flashTopic)&&((flashState[x.id]||{due:0}).due<=now))}
function renderFlash(){
  if(!flashQueue)flashQueue=shuffle(flashDue());
  const tk=['todos',...Object.keys(D)];
  const cur=flashQueue[0];
  app.innerHTML=`<div class="hy-intro"><h2>Flashcards</h2><p class="muted" style="margin:0">Repetição espaçada: o que você erra volta logo; o que acerta volta cada vez mais tarde.</p></div>
  <div class="filters">${tk.map(k=>`<button type="button" class="chip" aria-pressed="${flashTopic===k}" data-k="${k}">${k==='todos'?'Todos':esc(D[k])}</button>`).join('')}</div>
  ${cur?`<section class="panel"><p class="muted">Restam ${flashQueue.length} para revisar hoje</p>
    <h2 style="font-size:30px;margin:8px 0 14px">${cur.c.front}</h2>
    ${flashShow?`<div class="why">${cur.c.back}</div><div class="actions" style="justify-content:flex-start;margin-top:14px"><button class="btn ghost" data-g="0">Errei</button><button class="btn" data-g="1">Acertei</button></div>`
      :`<button class="btn" id="show">Mostrar resposta</button>`}</section>`
    :`<section class="panel"><h2 style="font-size:28px;text-transform:uppercase">Tudo revisado por hoje</h2><p class="muted">Volte amanhã: os cards que você acertou reaparecem no prazo certo.</p></section>`}`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flashTopic=b.dataset.k;flashQueue=null;flashShow=false;renderFlash()});
  const s=app.querySelector('#show');if(s)s.onclick=()=>{flashShow=true;renderFlash()};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const st=flashState[cur.id]||{box:0};st.box=b.dataset.g==='1'?Math.min(st.box+1,BOX_DAYS.length-1):0;st.due=Date.now()+BOX_DAYS[st.box]*864e5;flashState[cur.id]=st;store('flash',flashState);
    flashQueue.shift();if(b.dataset.g==='0')flashQueue.push(cur);flashShow=false;renderFlash()});
}

/* ---------- glossário ---------- */
let glossQ='';
function renderGloss(){
  const q=glossQ.toLowerCase();
  const items=DATA.glossary.filter(g=>!q||(g.term+' '+g.def).toLowerCase().includes(q)).sort((a,b)=>a.term.localeCompare(b.term,'pt-BR'));
  app.innerHTML=`<div class="hy-intro"><h2>Glossário</h2></div>
  <div class="filters"><input id="gq" type="search" placeholder="Buscar termo…" value="${esc(glossQ)}" style="flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit"></div>
  <section class="sheet">${items.map(g=>`<div class="panel"><h3>${esc(g.term)}</h3><p style="margin:0">${g.def}</p>${g.topic?`<div class="tx">${esc(D[g.topic]||g.topic)}</div>`:''}</div>`).join('')||'<p class="muted">Nada encontrado.</p>'}</section>`;
  const i=$('gq');i.oninput=()=>{glossQ=i.value;const p=i.selectionStart;renderGloss();const n=$('gq');n.focus();n.setSelectionRange(p,p)};
}

render();
/* exportar/importar progresso (histórico, erros, flashcards, discursivo, configuração) */
(function(){
  const f=document.createElement('footer');f.style.cssText='margin-top:32px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center';
  f.innerHTML='<button type="button" class="btn ghost" id="exp">Exportar progresso</button><button type="button" class="btn ghost" id="imp">Importar progresso</button><input type="file" id="impf" accept="application/json" hidden>';
  document.querySelector('.wrap').appendChild(f);
  $('exp').onclick=()=>{const o={};['cfg','hist','wrong','flash','disc'].forEach(k=>o[k]=load(k,null));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({key:M.storageKey,data:o})],{type:'application/json'}));a.download=`progresso-${M.storageKey}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('imp').onclick=()=>$('impf').click();
  $('impf').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
    if(j.key!==M.storageKey)throw new Error('outro site');Object.entries(j.data).forEach(([k,v])=>{if(v!==null)store(k,v)});toast('Progresso importado');setTimeout(()=>location.reload(),900)}catch(err){toast('Arquivo inválido para este site')}};r.readAsText(file)};
})();
</script>
