<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estudo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Great+Vibes&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Motor geral: base neutra adaptável automaticamente à matéria, claro/escuro automático, barra sticky, A4 no Cheat compacto */
:root{
  --pmix:100%; --tint:100%; --kmix:100%;
  --p-light:#1F5F8B; --p-dark:#74B9E8; --p-dark-ink:#091724;
  --primary:var(--p-light); --primary-ink:#FFFFFF;
  --primary-soft:color-mix(in srgb,var(--primary) 14%,var(--surface));
  --bg:color-mix(in srgb,var(--primary) 4%,#F4F5F6); --surface:#FFFFFF; --sunk:color-mix(in srgb,var(--primary) 6%,#EAECEF);
  --ink:#171A1F; --muted:#5A606B; --line:color-mix(in srgb,var(--primary) 10%,#D5D9E0);
  --accent-sec:var(--primary);
  --alert:#B42318; --alert-soft:#FBE4E1; --ok:#1C7A3B; --ok-soft:#DDF1E3; --warn:#9A5800; --warn-soft:#FBEBD3;
  --ref:#24527D; --ref-soft:#E5EEF8;
  --shadow:0 1px 2px rgba(23,26,31,.06),0 6px 18px rgba(23,26,31,.06);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--primary) 5%,#0F1115); --surface:#171A20; --sunk:color-mix(in srgb,var(--primary) 8%,#20242C);
  --ink:#E7E9EE; --muted:#9AA1AE; --line:color-mix(in srgb,var(--primary) 14%,#2D333D);
  --primary:var(--p-dark); --primary-ink:var(--p-dark-ink);
  --primary-soft:color-mix(in srgb,var(--primary) 24%,var(--surface)); --accent-sec:var(--primary);
  --alert:#F2705E; --alert-soft:#3D1D1A; --ok:#5DC48A; --ok-soft:#173623; --warn:#E6A24A; --warn-soft:#3A2A12;
  --ref:#8DBBE8; --ref-soft:#13243A; --shadow:0 1px 2px rgba(0,0,0,.4);
  --pmix:0%; --tint:28%; --kmix:0%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--primary) 5%,#0F1115); --surface:#171A20; --sunk:color-mix(in srgb,var(--primary) 8%,#20242C);
  --ink:#E7E9EE; --muted:#9AA1AE; --line:color-mix(in srgb,var(--primary) 14%,#2D333D);
  --primary:var(--p-dark); --primary-ink:var(--p-dark-ink);
  --primary-soft:color-mix(in srgb,var(--primary) 24%,var(--surface)); --accent-sec:var(--primary);
  --alert:#F2705E; --alert-soft:#3D1D1A; --ok:#5DC48A; --ok-soft:#173623; --warn:#E6A24A; --warn-soft:#3A2A12;
  --ref:#8DBBE8; --ref-soft:#13243A; --shadow:0 1px 2px rgba(0,0,0,.4);
  --pmix:0%; --tint:28%; --kmix:0%; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
img{max-width:100%;display:block}
a{color:var(--accent-sec)}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:750;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.18}
p{margin:0}
b{font-weight:650}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.th{--tbg:color-mix(in srgb,color-mix(in srgb,var(--p) var(--pmix),var(--d)) var(--tint),var(--surface));--tink:color-mix(in srgb,var(--d) var(--kmix),var(--p))}

/* Cabeçalho */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:18px 14px;display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.top h1{font-size:clamp(1.7rem,4.6vw,2.5rem);font-weight:800;text-transform:uppercase}
.sub{color:var(--muted);max-width:52rem;font-size:.96rem}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:2px}
.author{display:flex;align-items:baseline;gap:8px;color:var(--primary)}
.author small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.author span{font-family:"Great Vibes","Snell Roundhand","Segoe Script",cursive;font-size:clamp(26px,3.8vw,34px);line-height:1}
.seal{font-family:var(--mono);font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted);background:var(--sunk);white-space:nowrap}

/* Barra de abas sticky */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:9px 14px;min-height:44px;border-radius:10px;font-weight:600;font-size:.94rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--primary);color:var(--primary-ink)}
@media (max-width:600px){
  .tabs .wrap{-webkit-mask-image:linear-gradient(to right,#000 84%,transparent);mask-image:linear-gradient(to right,#000 84%,transparent)}
  .tab{padding:9px 11px;font-size:.89rem}
  .sub{font-size:.9rem}
}
.subtabs{background:var(--bg);border-bottom:1px solid var(--line)}
.subtabs .wrap{padding-block:8px;overflow-x:auto;scrollbar-width:none}
.subtabs .wrap::-webkit-scrollbar{display:none}
.subseg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:11px;min-width:max-content}
.subtab{border:0;background:transparent;padding:7px 14px;min-height:38px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.subtab:hover{color:var(--ink)}
.subtab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main .wrap{padding-block:20px 44px;display:grid;gap:18px}
main .wrap>*{min-width:0}

/* Peças comuns */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.src{font-size:.78rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec-h{display:grid;gap:3px}
.sec-h h2,.hy-intro h2{font-size:clamp(1.3rem,3vw,1.7rem);text-transform:uppercase}
.sec-title{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.help-dot{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--muted);font-family:var(--mono);font-size:.75rem;font-weight:700;cursor:help;padding:0;line-height:1;text-decoration:none}
.help-dot:hover,.help-dot:focus-visible{color:var(--ink);border-color:var(--muted);background:var(--surface)}
.hy-intro{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);padding:5px 12px;min-height:36px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.84rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.err{border-color:var(--alert)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.th{background:var(--tbg);color:var(--tink)}
.badge.kind{background:var(--primary-soft);color:var(--primary)}
.badge.model{background:var(--ref-soft);color:var(--ref)}
.badge.hot{background:var(--warn-soft);color:var(--warn)}
.fora{display:inline-block;font-size:.72rem;font-weight:650;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.stars{color:#C98A00;letter-spacing:1px;white-space:nowrap;font-size:.9rem}
.stars .st-off{color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:0;background:var(--primary);color:var(--primary-ink);padding:10px 18px;border-radius:9px;font-weight:650;cursor:pointer;font-size:.98rem}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.soft{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.no{background:var(--alert-soft);color:var(--alert)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:11px}
.seg button{border:0;background:transparent;padding:7px 14px;min-height:38px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}

/* Ranking */
.rank{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rank>summary{cursor:pointer;padding:12px 16px;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:8px;min-height:44px;align-items:center}
.rank>summary::-webkit-details-marker{display:none}
.rank>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
.rank[open]>summary::after{content:"−"}
.rk-top{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
.rank .in{padding:0 16px 16px;display:grid;gap:10px}
.rk-list{display:grid;gap:6px}
.rk{display:grid;grid-template-columns:2.1rem 1fr auto;gap:4px 10px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--tbg);color:var(--ink)}
.rk .n{font-family:var(--mono);font-weight:600;color:var(--tink)}
.rk .nm{font-weight:650;min-width:0}
.rk .pts{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right;font-size:.88rem}
.rk .ev{grid-column:2/-1;font-size:.8rem;color:var(--muted)}
.rk-tipo{width:100%;border-collapse:collapse;font-size:.86rem}
.rk-tipo td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.rk-tipo td.p{font-family:var(--mono);text-align:right;white-space:nowrap}

/* Prova e Treino */
.setup{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:820px){.setup{grid-template-columns:1fr}}
.field{margin-top:14px}
.field label.l{display:block;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.rules{margin:0;padding-left:18px;display:grid;gap:6px}
.rules li::marker{color:var(--primary)}
.hist{display:grid;gap:6px;margin-top:10px;font-variant-numeric:tabular-nums}
.hist .row{justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:.92rem}
.weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.weak span{background:var(--alert-soft);border-radius:999px;padding:3px 10px;font-size:.84rem;font-weight:600}
.stationbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.placard{font-family:var(--display);font-weight:750;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:6px 14px;border-radius:7px;font-size:1.15rem;font-variant-numeric:tabular-nums}
.progress{flex:1;min-width:120px;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s}
.timer{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums;margin-left:auto}
.timer svg{width:34px;height:34px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .bgc{stroke:var(--sunk)} .timer .fg{stroke:var(--primary);transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.low{color:var(--alert)} .timer.low .fg{stroke:var(--alert)}
.station{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.station{grid-template-columns:1fr}}
.gallery{display:grid;gap:8px;background:var(--sunk);padding:8px;border-radius:var(--r)}
.gallery.two{grid-template-columns:1fr 1fr}
.labcard{background:var(--surface);border-radius:8px;padding:14px;font-variant-numeric:tabular-nums;min-width:0;overflow-x:auto}
.labcard h3{font-size:1.05rem;text-transform:uppercase;margin-bottom:8px}
.labcard table{width:100%;border-collapse:collapse;font-size:.92rem}
.labcard td{padding:6px 6px 6px 0;border-bottom:1px dashed var(--line);vertical-align:top;overflow-wrap:break-word}
.labcard td:last-child{color:var(--muted);padding-right:0;padding-left:10px}
.labcard .flag{color:var(--alert);font-weight:700}
.zoomhint{font-size:.8rem;color:var(--muted);margin-top:4px}
.case{display:grid;gap:14px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.case .who{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--primary);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.case .story{font-size:1.03rem}
.q{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.q>p{font-weight:650}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);padding:10px 12px;min-height:44px;border-radius:9px;cursor:pointer;line-height:1.35}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .k{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)} .opt.wrong .k{background:var(--alert);border-color:var(--alert);color:var(--surface)}
.opt:disabled{cursor:default}
.why{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:.94rem}
.why b{color:var(--primary)}
.look{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 9px 9px 0;font-size:.94rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:40}
.ta{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;resize:vertical;min-height:105px;line-height:1.45}
.ta[readonly]{background:var(--sunk)}
.chk{display:grid;gap:6px;background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:.94rem}
.ai-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.ai-fb{border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:0 9px 9px 0;padding:10px 12px;font-size:.93rem}
.chk label,.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 6px;border-radius:7px}
.chk input,.ck input{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--primary)}
.score{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.big{font-family:var(--mono);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.verdict{flex:1;min-width:220px}
.review{display:grid;gap:12px}
.rv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:var(--r);padding:12px}
.rv.bad{border-left-color:var(--alert)}
.rv img{width:120px;height:100px;object-fit:cover;border-radius:7px}
.rv h3{font-size:1.1rem;text-transform:uppercase}
.rv ul{margin:6px 0 0;padding-left:18px;font-size:.94rem;display:grid;gap:6px}
.rv .y{color:var(--alert)} .rv .c{color:var(--ok);font-weight:600}
@media (max-width:520px){.rv{grid-template-columns:1fr}.rv img{width:100%;height:160px}}

/* Fotos, diagramas e Lightbox */
.ph{margin:0;display:grid;gap:6px;min-width:0}
.ph-btn{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;cursor:zoom-in;display:block;width:100%}
.ph-btn img{width:100%;height:auto;max-height:260px;object-fit:contain;margin:0 auto}
.ph figcaption{font-size:.78rem;color:var(--muted)}
.ph-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));align-items:start}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;min-width:0;overflow:hidden}
.fig svg{width:100%;max-width:720px;margin:0 auto;height:auto;display:block}
.flow{display:grid;gap:6px;justify-items:stretch}
.flow-step{background:var(--tbg,var(--sunk));border:1px solid var(--tink,var(--primary));border-radius:8px;padding:8px 12px;font-size:.88rem;font-weight:600;line-height:1.35;text-align:center;color:var(--ink);overflow-wrap:anywhere}
.flow-arr{text-align:center;color:var(--tink,var(--primary));font-size:.95rem;line-height:1;user-select:none}
.nophoto{font-size:.82rem;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(5,8,8,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb figure{margin:0;display:grid;gap:10px;max-width:min(100%,1000px)}
.lb img{max-height:78vh;width:auto;margin:0 auto;border-radius:8px}
.lb figcaption{color:#F1F1F1;text-align:center;font-size:.9rem}
.lb .lb-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);background:#fff;color:#111;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}

/* Atlas e filtros */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.atlas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:190px;object-fit:cover;cursor:zoom-in;background:#000}
.card .cb{padding:10px 12px;display:grid;gap:4px}
.card .dz{font-family:var(--display);font-size:1.1rem;font-weight:750;text-transform:uppercase}
.card .cap{font-size:.86rem;color:var(--muted)}
.card .reveal{border:1px dashed var(--primary);background:var(--primary-soft);color:var(--primary);border-radius:7px;padding:8px;font-weight:700;cursor:pointer}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sheet .panel{padding:14px}
.sheet h3{font-size:1.15rem;text-transform:uppercase;margin-bottom:6px}
.sheet ul{margin:0;padding-left:18px;font-size:.94rem;display:grid;gap:3px}
.sheet .tx{margin-top:8px;font-size:.86rem;background:var(--sunk);padding:6px 8px;border-radius:6px}

/* Toggle Switch */
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;min-height:44px}
.switch input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{transform:translateX(18px)}

/* 80/20, Alertas e Pares */
.alert-list{display:grid;gap:10px}
.alert{border-left:4px solid var(--alert);background:var(--alert-soft);border-radius:0 var(--r) var(--r) 0;padding:12px 14px;display:grid;gap:6px}
.alert .num,.rule .num{font-family:var(--mono);font-weight:600;color:var(--alert);margin-right:6px}
.quote{font-style:italic;color:var(--alert);font-size:.9rem}
.dir{border:1px solid color-mix(in srgb,var(--ref) 35%,transparent);background:var(--ref-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.dir .dir-h{font-weight:700;color:var(--ref);font-size:.9rem}
.tblock{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tband{background:var(--tbg);color:var(--tink);padding:10px 14px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px}
.tband h3{font-size:1.1rem;font-weight:750;color:var(--tink)}
.tbody{padding:12px 14px;display:grid;gap:12px}
.r80-grid{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media (min-width:860px){.r80-grid{grid-template-columns:minmax(0,1fr) minmax(260px,360px)}}
.rules-list{display:grid;gap:8px}
.rules20{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:r}
.rules20 li{counter-increment:r;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rules20 li::before{content:counter(r,decimal-leading-zero);font-family:var(--mono);font-weight:700;font-size:1.4rem;line-height:1.1;color:var(--primary)}
.rules20 b{display:block;font-size:1.02rem}
.pairs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.pair{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.pair h3{font-size:1.05rem}
.pair .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start;font-weight:650}
.pair .vs .x{color:var(--muted);font-family:var(--mono)}
.pair .key{font-size:.82rem;color:var(--muted)}
.pair .ans2{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;font-size:.9rem}
.pair .ans2>div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:110px minmax(0,1fr)}
.dcard img{width:110px;height:100%;min-height:140px;object-fit:cover;cursor:zoom-in;background:#000}
.dcard .nolab{display:grid;place-items:center;text-align:center;background:var(--tbg);color:var(--tink);font-size:.82rem;font-weight:700;padding:8px}
.dcard .db{padding:10px 12px;display:grid;gap:4px;font-size:.88rem}
.dcard h3{font-size:1.1rem}
.dcard .ag{color:var(--muted);font-size:.82rem}
.dcard .cd{background:var(--sunk);border-radius:6px;padding:6px 8px;margin-top:2px}

/* Cards */
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));align-items:start}
.ccard{background:var(--tbg);border:1px solid color-mix(in srgb,var(--tink) 22%,transparent);border-radius:14px;padding:14px;display:grid;gap:10px;align-content:start;color:var(--ink)}
.ccard .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ccard .hd-l{display:flex;gap:10px;align-items:center;min-width:0}
.ccard .hd img{width:52px;height:52px;border-radius:9px;object-fit:cover;cursor:zoom-in;flex:none}
.ccard h3{font-size:1.12rem;color:var(--tink);font-weight:800;text-transform:uppercase}
.ccard dl{margin:0;display:grid;gap:7px}
.ccard dt{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--tink)}
.ccard dd{margin:0;font-size:.92rem;line-height:1.4}
.ccard .warnb{background:color-mix(in srgb,var(--surface) 75%,transparent);border-left:3px solid var(--alert);border-radius:6px;padding:7px 9px;font-size:.88rem;font-weight:600}
.ccard .src{border-top:1px solid color-mix(in srgb,var(--tink) 20%,transparent);padding-top:6px}

/* Definitivo */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.dnav{display:flex;flex-wrap:wrap;gap:6px}
.dpage{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);scroll-margin-top:calc(68px + env(safe-area-inset-top,0px));display:grid}
.dpage.duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dpage.duo .pfoot{grid-column:1/-1}
@media (max-width:820px){.dpage.duo{grid-template-columns:1fr}}
.dsheet{display:grid;align-content:start;min-width:0}
.dsheet.half+.dsheet.half{border-left:1px dashed var(--line)}
@media (max-width:820px){.dsheet.half+.dsheet.half{border-left:0;border-top:1px dashed var(--line)}}
.dsheet .tband{padding:14px 16px}
.dsheet .tband h3{font-size:1.3rem;text-transform:uppercase}
.pbody{padding:16px;display:grid;gap:14px}
.casebox{background:var(--sunk);border-left:4px solid var(--tink);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.casebox .bancada{font-weight:650}
.casebox .bancada .lbl2{color:var(--primary)}
details.ansd>summary{cursor:pointer;color:var(--primary);font-weight:650;min-height:36px;display:inline-flex;align-items:center}
details.ansd>p{margin-top:6px}
.flds{display:grid;border-top:1px solid var(--line)}
.fld{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
@media (min-width:700px){.fld{grid-template-columns:12rem minmax(0,1fr);gap:14px}}
.dsheet.half .fld{grid-template-columns:1fr}
.lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tink)}
.fld .val{min-width:0}
.fld ul{margin:0;padding-left:18px;display:grid;gap:3px}
.reveal{display:none;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;color:var(--primary);font-weight:600}
body.study .reveal{display:inline-flex;align-items:center}
body.study .fld:not(.shown) .ans{display:none}
body.study .fld.shown .reveal{display:none}
.ddif{background:var(--tbg);border-radius:10px;padding:10px 12px}
.ddif h4{font-size:1rem;text-transform:uppercase;margin-bottom:4px;color:var(--tink)}
.ddif ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.92rem}
.dprof{background:var(--alert-soft);border:1px solid color-mix(in srgb,var(--alert) 35%,transparent);border-radius:10px;padding:10px 12px}
.dprof h4{font-size:1rem;text-transform:uppercase;margin-bottom:4px;color:var(--alert)}
.dprof ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.92rem}
.pfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:10px 16px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);font-family:var(--mono)}

/* Comparativo */
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cmp .chd{padding:12px 16px;display:grid;gap:3px}
.cmp h3{font-size:1.12rem}
.cmp .tw{overflow-x:auto}
.cmp table{width:100%;border-collapse:collapse;font-size:.9rem}
.cmp th,.cmp td{padding:8px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.cmp thead th{background:var(--tbg);color:var(--tink);font-size:.82rem}
.cmp tbody th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.cmp tr.key td,.cmp tr.key th{background:var(--primary-soft)}
.cmp tr.key th{color:var(--primary);font-weight:750}
.cmp .stack{display:none;padding:0 12px 12px;gap:10px}
.cmp .scol{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.cmp .scol h4{font-size:1rem;color:var(--tink)}
.cmp .scol .it{display:grid;gap:2px}
.cmp .scol .it.key{background:var(--primary-soft);border-radius:8px;padding:4px 8px}
.cmp .scol .il{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
@media (max-width:759px){.cmp .tw{display:none}.cmp .stack{display:grid}}

/* Resumo F (Feynman) */
.fblock{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fsteps{padding:14px 16px;display:grid;gap:14px}
.fstep{display:grid;gap:6px}
.fstep .sh{display:flex;align-items:baseline;gap:8px;font-weight:700;flex-wrap:wrap}
.fstep .sh .sn{font-family:var(--mono);color:var(--tink);background:var(--tbg);border-radius:6px;padding:1px 7px;font-size:.85rem}
.analogy{background:var(--sunk);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.analogy .fails{font-size:.9rem;color:var(--muted)}
.stuck{margin:0;padding-left:1.1rem;display:grid;gap:4px}
.checklist{display:grid;gap:6px}
.ck{background:var(--sunk)}
.covered{font-family:var(--mono);font-size:.86rem;color:var(--ok);font-weight:600}

/* Cheat sheet */
.cheat-full{column-gap:14px}
@media (min-width:760px){.cheat-full{column-count:2}}
.cblock{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--tbg);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:grid;gap:6px}
.cblock h3{font-size:1rem;color:var(--tink);display:flex;justify-content:space-between;gap:6px}
.cblock ul{margin:0;padding-left:1rem;display:grid;gap:3px;font-size:.9rem}
.cblock li.w,.mb li.w{color:var(--alert);font-weight:650}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.mini-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;border-bottom:2px solid var(--primary);padding-bottom:6px}
.mini-h h3{font-size:1.1rem;font-weight:800;text-transform:uppercase}
.mini-body{column-gap:12px}
@media (min-width:760px){.mini-body{column-count:2}}
.mb{break-inside:avoid;border-left:4px solid var(--tbg);padding:2px 0 2px 8px;margin-bottom:8px}
.mb h4{font-size:.86rem;color:var(--tink)}
.mb ul{margin:2px 0 0;padding-left:.95rem;font-size:.85rem;display:grid;gap:1px}
.mpairs{break-inside:avoid;border-left:4px solid var(--primary);padding-left:8px;font-size:.85rem}
.mpairs h4{font-size:.86rem;color:var(--primary)}
.mpairs div{display:flex;justify-content:space-between;gap:8px}

/* Provas antigas */
.examlist{display:grid;gap:14px}
.examq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.examq .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.examq h3{font-size:1.18rem}
.examq .enun{white-space:pre-line;font-size:.97rem}
.examq ul.altlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.examq ul.altlist li button{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:.94rem}
.examq ul.altlist li.ans button{border-color:var(--ok);background:var(--ok-soft);font-weight:650}
.examq ul.altlist li.bad button{border-color:var(--alert);background:var(--alert-soft)}

/* Flashcards */
.fc-wrap{display:grid;gap:12px;max-width:42rem;width:100%;margin:0 auto}
.fc-bar{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.fc-bar>div{height:100%;background:var(--primary);transition:width .25s}
.fc-card{background:var(--surface);border:1px solid var(--line);border-top:8px solid var(--tbg);border-radius:16px;min-height:240px;padding:18px;display:grid;gap:12px;align-content:start;cursor:pointer;box-shadow:var(--shadow)}
.fc-card .q{display:block;border-top:0;padding-top:0;font-size:1.22rem;font-weight:700;font-family:var(--display);line-height:1.35}
.fc-card .a{border-top:1px dashed var(--line);padding-top:12px;font-size:1.02rem}
.fc-card .hint{font-size:.82rem;color:var(--muted)}
.fc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-actions .btn{min-height:50px}

/* Glossário inline e tooltips de ajuda */
.gl{text-decoration:none;cursor:help}
.gl:hover,.gl:focus-visible{text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
#gltip{position:absolute;z-index:60;max-width:min(19rem,calc(100vw - 32px));background:var(--ink);color:var(--bg);font-size:.85rem;line-height:1.4;padding:8px 10px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none}
#gltip b{display:block;font-family:var(--mono);font-size:.78rem;margin-bottom:2px}

/* Rodapé */
.foot{border-top:1px solid var(--line);background:var(--surface)}
.foot .wrap{padding-block:16px 28px;display:grid;gap:12px;font-size:.88rem}
.foot-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;font-size:.8rem;color:var(--muted)}
.foot-links{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.foot-link{background:none;border:0;padding:4px 2px;min-height:32px;cursor:pointer;color:var(--muted);font:inherit;font-size:.8rem;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
.foot-link:hover{color:var(--ink)}
.hmodal{position:fixed;inset:0;z-index:55;background:rgba(5,8,8,.72);display:grid;place-items:center;padding:16px}
.hmodal-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:540px;width:100%;max-height:80vh;overflow:auto;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:12px}
.hmodal-hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hmodal-list{margin:0;padding-left:1.1rem;display:grid;gap:8px;font-size:.9rem}

/* Impressão A4 para o Cheat compacto */
@page{size:A4;margin:10mm}
@media print{
  body{background:#fff;color:#111;font-size:10pt}
  body::before,.top,.tabs,.subtabs,.foot,.rank,.seg,.cut-note,.no-print,#gltip{display:none!important}
  main .wrap{padding:0;max-width:none;gap:0}
  .mini{border:0;padding:0;gap:6pt;box-shadow:none}
  .mini-body{column-count:2;column-gap:6mm}
  .mb ul,.mpairs{font-size:10pt}
  .mb h4,.mpairs h4{font-size:10.5pt}
  .mini-h h3{font-size:13pt}
  .gl{text-decoration:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

    {term:"SRAA", def:"Sistema Reticular Ativador Ascendente (SARA): via do tronco encefálico ao tálamo medial bilateral e córtex responsável pelo ciclo sono-vigília.", topic:"coma"},
    {term:"PPC", def:"Pressão de Perfusão Cerebral (PPC = PAM − PIC). Deve ser mantida acima de 60 mmHg para evitar isquemia cerebral.", topic:"lcr"},
    {term:"PIC", def:"Pressão Intracraniana. Sua elevação produz cefaleia, vômitos, rebaixamento, papiledema e Tríade de Cushing.", topic:"lcr"},
    {term:"BHE", def:"Barreira Hematoencefálica: conjunto microscópico de zônulas de oclusão endoteliais, pericitos e pés de astrócitos. Ausente na área postrema, eminência mediana, hipófise posterior e pineal.", topic:"lcr"},
    {term:"LCR", def:"Líquido Cefalorraquidiano (líquor): volume de 90–150 mL (~500 mL/dia), produzido no plexo coroide e reabsorvido nas granulações aracnoides.", topic:"lcr"},
    {term:"PICA", def:"Artéria Cerebelar Posteroinferior (ramo da vertebral): irriga porção posteroinferior do cerebelo e bulbo.", topic:"circ"},
    {term:"AICA", def:"Artéria Cerebelar Anteroinferior (ramo da basilar): irriga região anteroinferior do cerebelo.", topic:"circ"},
    {term:"ACA", def:"Artéria Cerebral Anterior (A1–A3): ramo terminal da carótida interna; irriga face medial dos hemisférios e corpo caloso (déficit crural + apraxia).", topic:"circ"},
    {term:"ACM", def:"Artéria Cerebral Média (M1–M4): irriga a convexidade lateral cerebral e origina as artérias lenticuloestriadas.", topic:"circ"},
    {term:"ACP", def:"Artéria Cerebral Posterior (P1–P4): ramo terminal da artéria basilar; irriga lobo occipital, base posterior do temporal e tálamo.", topic:"circ"},
    {term:"ACI", def:"Artéria Carótida Interna: origina a circulação cerebral anterior; não emite ramos no pescoço.", topic:"circ"},
    {term:"TVC", def:"Trombose Venosa Cerebral: associada a alto risco em tabagismo + reposição hormonal; a forma profunda compromete hipotálamo e SRAA.", topic:"circ"},
    {term:"Papiledema", def:"Edema de papila observado na fundoscopia; sinal indireto de hipertensão intracraniana sustentada.", topic:"lcr"},
    {term:"Tríade de Cushing", def:"Hipertensão arterial + bradicardia + alteração respiratória (bradipneia); indica hipertensão intracraniana grave e risco iminente de morte.", topic:"lcr"},
    {term:"Decorticação", def:"Postura motora patológica (RM 3 no Glasgow) com flexão anormal dos MMSS; controle deslocado para o núcleo rubro com mesencéfalo ainda íntegro.", topic:"coma"},
    {term:"Decerebração", def:"Postura motora patológica (RM 2 no Glasgow) com extensão rígida dos membros; indica lesão mais caudal do tronco encefálico.", topic:"coma"},
    {term:"Locked-in", def:"Síndrome do Encarceramento por lesão pontina extensa: tetraplegia e anartria com consciência preservada (comunicação por piscadas).", topic:"coma"},
    {term:"Anartria", def:"Incapacidade motora completa de articular a fala apesar da preservação da linguagem e consciência (clássica na síndrome locked-in).", topic:"coma"},
    {term:"NIP", def:"Nervo Interósseo Posterior: ramo motor profundo do nervo radial; sua lesão causa dedos caídos poupando a extensão radial do punho e a sensibilidade.", topic:"perif"},
    {term:"NIA", def:"Nervo Interósseo Anterior: ramo motor proximal do nervo mediano; sua lesão impede fletir as falanges distais do polegar e do indicador sem déficit sensitivo.", topic:"perif"},
    {term:"STC", def:"Síndrome do Túnel do Carpo: compressão do nervo mediano sob o ligamento transverso do carpo (LTC); Tinel/Phalen positivos; poupa ramo cutâneo palmar.", topic:"perif"},
    {term:"Sinal de Froment", def:"Flexão compensatória da articulação interfalângica do polegar pelo flexor longo do polegar (mediano) diante de fraqueza do adutor do polegar (ulnar).", topic:"perif"},
    {term:"Garra ulnar", def:"Hiperextensão das metacarpofalângicas e flexão das interfalângicas do 4º e 5º dedos por fraqueza dos músculos lumbricais ulnares.", topic:"perif"},
    {term:"Meralgia parestésica", def:"Dor em queimação e hipoestesia puramente sensitiva na face anterolateral da coxa por compressão do nervo cutâneo femoral lateral sob o ligamento inguinal.", topic:"perif"},
    {term:"Sinal de Lasègue", def:"Reprodução de dor radicular irradiada ao elevar passivamente o membro inferior estendido (característico de radiculopatia lombossacra).", topic:"rac"},
    {term:"Alodínia", def:"Dor provocada por um estímulo que normalmente não é doloroso.", topic:"rac"},
    {term:"Hiperalgesia", def:"Resposta dolorosa desproporcionalmente intensa a um estímulo doloroso padrão.", topic:"rac"},
    {term:"Estereognosia", def:"Função sensorial cortical secundária de identificar objetos apenas pelo tato com os olhos fechados.", topic:"rac"},
    {term:"Grafestesia", def:"Função sensorial cortical secundária de reconhecer números, letras ou formas traçadas na pele.", topic:"rac"},
    {term:"AMS", def:"Atrofia de Múltiplos Sistemas: doença neurodegenerativa rapidamente progressiva que combina disautonomia precoce, sinais piramidais e parkinsonismo (AMS-P) ou ataxia cerebelar (AMS-C).", topic:"sna"},
    {term:"Síndrome de Horner", def:"Tríade de ptose, miose e anidrose facial causada por lesão da via simpática (central, pré-ganglionar ou pós-ganglionar).", topic:"sna"}
  ]

function gloss(root){

  <section class="review">${run.stations.map((st,i)=>{const ok=st.qs.every(qOK),s=st.s,imgs=sImgs(s),tp=sTopic(s);
    return `<article class="rv ${ok?'':'bad'}">${imgs[0]?tagImg(imgs[0],''):`<div class="labcard" style="padding:8px;font-size:.82rem"><b>${esc(s.title||(s.table&&s.table.title)||lbl.one+' '+(i+1))}</b></div>`}
    <div><h3>${esc(lbl.one)} ${i+1} · ${esc(s.title||D[tp]||'')}</h3><ul>${st.qs.map((q,qi)=>rvQ(q,i,qi)).join('')}</ul>

    const mb=ORDER.filter(id=>mini[id]&&mini[id].length).map(id=>`<div class="mb th" style="${ts(id)}"><h4>${esc((TH[id]&&TH[id].short)||D[id])} ${'★'.repeat((TH[id]&&TH[id].stars)||0)}</h4><ul data-gl>${mini[id].map(x=>x.indexOf('⚠')===0?`<li class="w">${esc(x)}</li>`:`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');
    const pr=pairs.length?`<div class="mpairs"><h4>Pares que confundem</h4>${pairs.map(p=>`<div><span>${esc(p[0])}</span><b>${esc(p[1])}</b></div>`).join('')}</div>`:'';
    body=`<section class="mini" id="mini"><div class="mini-h"><h3>Cheat compacto · ${esc(M.title)}</h3>${revStr?`<span class="seal">${esc(revStr)}</span>`:''}</div><div class="mini-body">${mb}${pr}</div></section>${C.cutNote?`<p class="cut-note small muted">${esc(C.cutNote)}</p>`:''}`;
  }else{
    body=`<div class="cheat-full">${ORDER.filter(id=>full[id]&&full[id].length).map(id=>`<section class="cblock th" style="${ts(id)}"><h3><span>${esc(D[id]||id)}</span>${stars(TH[id].stars)}</h3><ul data-gl>${full[id].map(x=>x.indexOf('⚠')===0?`<li class="w">${esc(x)}</li>`:`<li>${esc(x)}</li>`).join('')}</ul></section>`).join('')}</div>`;
  }
  app.innerHTML=`<div class="sec-h"><h2>Cheat sheet</h2>${revStr?`<p class="muted small">${esc(revStr)}</p>`:''}</div>${seg}${body}`;
  app.querySelectorAll('[data-cheat]').forEach(b=>b.onclick=()=>{cheatMode=b.dataset.cheat;store('cheat',cheatMode);renderCheat();gloss(app)});
  const prt=$('prt');if(prt)prt.onclick=()=>window.print();
}

/* ---------- provas antigas ---------- */
let provaFilter='todos', provaSrc='todos', provaOpen=new Set(), provaPick={};
function renderProvas(){
  const listAll=DATA.provas||[];
  const tKeys=['todos',...ORDER.filter(k=>listAll.some(q=>q.topic===k))];
  const sVals=[...new Set(listAll.map(q=>q.year||q.source).filter(Boolean))];
  const list=listAll.filter(q=>(provaFilter==='todos'||q.topic===provaFilter)&&(provaSrc==='todos'||(q.year||q.source)===provaSrc));
  app.innerHTML=`${secHead('Provas antigas','Questões originais para conferir estilo de cobrança, gabarito e comentário.')}
  <div class="filters">${tKeys.map(k=>`<button type="button" class="chip" aria-pressed="${provaFilter===k}" data-pk="${k}">${k==='todos'?'Todas ('+listAll.length+')':esc(D[k]||k)}</button>`).join('')}</div>
  ${sVals.length>1?`<div class="filters">${['todos',...sVals].map(s=>`<button type="button" class="chip" aria-pressed="${provaSrc===s}" data-ps="${esc(s)}">${s==='todos'?'Todas as fontes':esc(s)}</button>`).join('')}</div>`:''}
  <section class="examlist">${list.map(q=>{const open=provaOpen.has(q.id),pk=provaPick[q.id];
    return `<article class="examq"><div class="meta">${chipTh(q.topic)}<span>${esc(q.source||'')}${q.year?' · '+esc(q.year):''}${q.type?' · '+esc(q.type):''}</span>${q.hot?'<span class="badge hot">Cai muito</span>':''}</div>
    <h3>${esc(q.title)}</h3><p class="enun" data-gl>${esc(q.enun)}</p>
    ${q.opts&&q.opts.length?`<ul class="altlist">${q.opts.map((o,oi)=>{let cls='';if(open){if(o===q.ans)cls='ans';else if(o===pk)cls='bad'}return `<li class="${cls}"><button type="button" data-po="${esc(q.id)}" data-oi="${oi}" ${open?'disabled':''}>${esc(o)}</button></li>`}).join('')}</ul>`:''}
    <div><button type="button" class="btn ghost" data-pq="${esc(q.id)}">${open?'Esconder gabarito':'Ver gabarito e comentário'}</button></div>
    ${open?`<div class="why" data-gl><b>Gabarito:</b> ${esc(q.ans)}${q.why?`<br><br><b>Comentário:</b> ${esc(q.why)}`:''}</div>`:''}</article>`}).join('')}</section>`;
  app.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{provaFilter=b.dataset.pk;renderProvas();gloss(app)});
  app.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{provaSrc=b.dataset.ps;renderProvas();gloss(app)});
  app.querySelectorAll('[data-pq]').forEach(b=>b.onclick=()=>{const id=b.dataset.pq;provaOpen.has(id)?provaOpen.delete(id):provaOpen.add(id);renderProvas();gloss(app)});
  app.querySelectorAll('[data-po]').forEach(b=>b.onclick=()=>{const id=b.dataset.po,q=listAll.find(x=>x.id===id);if(q){provaPick[id]=q.opts[+b.dataset.oi];provaOpen.add(id);renderProvas();gloss(app)}});
}

/* ---------- flashcards (Leitner + priorização intercalada por estrelas) ---------- */
const BOX_DAYS=[0,1,3,7,16];
const FC_TYPE={rec:"Recordação",foto:"Foto → diagnóstico",caso:"Caso → conduta"};
let flashState=load('flash',{}), flashQueue=null, flashShow=false, flashTopic='todos', flashOk=0, flashTotal=0;
const fcTopic=c=>c.topic||c.th;
const fcFront=c=>c.front||c.f||'';
const fcBack=c=>c.back||c.b||'';
function flashId(c,i){return c.id||('f'+i)}
function flashDue(ignoreDue=false){
  const now=Date.now(), raw=(DATA.flash||[]).map((c,i)=>({c,id:flashId(c,i)})).filter(x=>(flashTopic==='todos'||fcTopic(x.c)===flashTopic)&&(ignoreDue||((flashState[x.id]||{due:0}).due<=now)));
  const groups=ORDER.map(id=>shuffle(raw.filter(x=>fcTopic(x.c)===id)));
  const rest=shuffle(raw.filter(x=>!TH[fcTopic(x.c)]));
  const deck=[];let more=true,r=0;
  while(more){more=false;groups.forEach(g=>{if(g[r]!=null){deck.push(g[r]);more=true}});r++}
  return [...deck,...rest];
}
function renderFlash(){
  if(!flashQueue){flashQueue=flashDue(false);flashOk=0;flashTotal=flashQueue.length}
  const tk=['todos',...ORDER.filter(k=>(DATA.flash||[]).some(c=>fcTopic(c)===k))];
  const cur=flashQueue[0];
  const done=flashTotal-flashQueue.length, pct=flashTotal?Math.round(done/flashTotal*100):100;
  let body='';
  if(cur){
    const c=cur.c,tp=fcTopic(c),vis=c.img?photoFig(c.img,'loading="eager"'):c.fig?renderFigure(c.fig):'';
    body=`<div class="fc-wrap"><div class="row small muted"><span>Restam ${flashQueue.length} para revisar hoje</span><span>·</span><span>${flashOk} acertos</span></div>
    <div class="fc-bar"><div style="width:${pct}%"></div></div>
    <div class="fc-card th" style="${ts(tp)}" tabindex="0" role="button" aria-label="Virar flashcard" id="fccard">
      <div class="row">${c.type&&FC_TYPE[c.type]?`<span class="badge kind">${esc(FC_TYPE[c.type])}</span>`:''}${chipTh(tp)}</div>
      <p class="q" data-gl>${fcFront(c)}</p>${vis}
      ${flashShow?`<div class="a" data-gl>${fcBack(c)}</div>`:'<p class="hint">Toque no card para ver a resposta</p>'}
    </div>
    ${flashShow?`<div class="fc-actions"><button type="button" class="btn no" data-g="0">Errei</button><button type="button" class="btn ok" data-g="1">Acertei</button></div>`:`<div class="fc-actions"><button type="button" class="btn" id="show" style="grid-column:1/-1">Mostrar resposta</button></div>`}</div>`;
  }else{
    body=`<section class="panel" style="display:grid;gap:10px;max-width:42rem;margin:0 auto;width:100%"><h2 style="font-size:1.5rem;text-transform:uppercase">Tudo revisado por hoje</h2><p class="muted">Volte amanhã: os cards que você acertou reaparecem no prazo certo.</p>${DATA.flash&&DATA.flash.length?`<div><button type="button" class="btn ghost" id="fcreall">Revisar todos agora (${DATA.flash.length})</button></div>`:''}</section>`;
  }
  app.innerHTML=`${secHead('Flashcards','Repetição espaçada: o que você erra volta logo; tópicos prioritários aparecem intercalados.')}
  <div class="filters">${tk.map(k=>`<button type="button" class="chip" aria-pressed="${flashTopic===k}" data-k="${k}">${k==='todos'?'Todos':esc((TH[k]&&TH[k].short)||D[k])}</button>`).join('')}</div>${body}`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{flashTopic=b.dataset.k;flashQueue=null;flashShow=false;renderFlash();gloss(app)});
  const s=$('show');if(s)s.onclick=()=>{flashShow=true;renderFlash();gloss(app)};
  const fc=$('fccard');if(fc){fc.onclick=e=>{if(e.target.closest('[data-zoom]'))return;flashShow=!flashShow;renderFlash();gloss(app)};fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flashShow=!flashShow;renderFlash();gloss(app)}}}
  const all=$('fcreall');if(all)all.onclick=()=>{flashQueue=flashDue(true);flashOk=0;flashTotal=flashQueue.length;flashShow=false;renderFlash();gloss(app)};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    const st=flashState[cur.id]||{box:0};const ok=b.dataset.g==='1';if(ok)flashOk++;
    st.box=ok?Math.min(st.box+1,BOX_DAYS.length-1):0;st.due=Date.now()+BOX_DAYS[st.box]*864e5;flashState[cur.id]=st;store('flash',flashState);
    flashQueue.shift();if(!ok)flashQueue.push(cur);flashShow=false;renderFlash();gloss(app)});
}

/* ---------- glossário (aba) ---------- */
let glossQ='';
function renderGloss(){
  const q=glossQ.toLowerCase();
  const items=GL_LIST.filter(g=>!q||(g.term+' '+g.def).toLowerCase().includes(q)).sort((a,b)=>a.term.localeCompare(b.term,'pt-BR'));
  app.innerHTML=`${secHead('Glossário','Os termos listados aqui também exibem definição rápida ao tocar ou passar o cursor nos textos.')}
  <div class="filters"><input id="gq" type="search" placeholder="Buscar termo…" value="${esc(glossQ)}" style="flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit"></div>
  <section class="sheet">${items.map(g=>`<div class="panel"><h3>${esc(g.term)}</h3><p>${g.def}</p>${g.topic?`<div class="tx">${esc(D[g.topic]||g.topic)}</div>`:''}</div>`).join('')||'<p class="muted">Nada encontrado.</p>'}</section>`;
  const i=$('gq');i.oninput=()=>{glossQ=i.value;const p=i.selectionStart;renderGloss();const n=$('gq');n.focus();n.setSelectionRange(p,p)};
}

/* ---------- ranking (aba) ---------- */
function renderRanking(){
  const blk=rankBlock(true);
  app.innerHTML=`${secHead('Ranking do que mais cai','Prioridade calculada a partir das provas e da ênfase em aula.')}${blk||'<p class="muted">Nenhum ranking cadastrado para esta matéria.</p>'}`;
}

/* ---------- roteamento ---------- */
const VIEWS={prova:()=>{if(!run)return renderSetup();if(run.done)return renderResult();renderStation()},discursiva:()=>{if(!run)return renderDiscSetup();if(run.done)return renderResult();renderStation()},treino:()=>{if(!run)return renderTreinoSetup();if(run.done)return renderResult();renderStation()},atlas:renderAtlas,resumo:renderResumo,cards:renderCards,def:renderDef,comparativo:renderComp,feynman:renderFeynman,cheat:renderCheat,provas:renderProvas,flash:renderFlash,ranking:renderRanking,glossario:renderGloss};
function goTab(nextTab){
  if(!DATA.tabs.includes(nextTab))return;
  stopTimer();
  if(location.hash.slice(1)!==nextTab)location.hash=nextTab;
  else{tab=nextTab;run=null;render()}
}
function render(){
  if(!run||run.done||(tab!=='prova'&&tab!=='discursiva'&&tab!=='treino'))stopTimer();
  if(tab!=='def')document.body.classList.remove('study');
  const activeNav=NAV_ITEMS.find(n=>n.items.includes(tab))||NAV_ITEMS[0];
  if(activeNav)lastSub[activeNav.id]=tab;
  document.querySelectorAll('.tabs button').forEach(x=>{const on=activeNav&&x.dataset.nav===activeNav.id;x.setAttribute('aria-selected',on);if(on){const bar=x.parentElement;bar.scrollLeft=Math.max(0,x.offsetLeft-(bar.clientWidth-x.offsetWidth)/2)}});
  const sb=$('subtabs'),sl=$('subtabs-list');
  if(sb&&sl){
    if(activeNav&&activeNav.items.length>1){
      sb.hidden=false;
      sl.innerHTML=activeNav.items.map(t=>`<button type="button" class="subtab" role="tab" id="tab-${t}" aria-selected="${t===tab}" data-tab="${t}">${esc(TABNAMES[t]||t)}</button>`).join('');
      sl.querySelectorAll('button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
      const cur=sl.querySelector('[aria-selected="true"]');
      if(cur){const sc=sb.querySelector('.wrap');if(sc)sc.scrollLeft=Math.max(0,cur.offsetLeft-(sc.clientWidth-cur.offsetWidth)/2)}
    }else{sb.hidden=true;sl.innerHTML=''}
  }
  (VIEWS[tab]||VIEWS[DATA.tabs[0]])();
  gloss(app);hideTip();
}
function route(){
  const h=(location.hash||'').slice(1);
  if(h&&DATA.tabs.includes(h)&&h!==tab){stopTimer();tab=h;run=null}
  render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  const nav=NAV_ITEMS.find(n=>n.id===b.dataset.nav);if(!nav)return;
  const nextTab=nav.items.includes(lastSub[nav.id])?lastSub[nav.id]:nav.items[0];
  goTab(nextTab);
}));
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(lb)lb.hidden=true;const hm=$('histmodal');if(hm)hm.hidden=true;hideTip()}});
document.addEventListener('click',e=>{const t=e.target,g=t.closest&&t.closest('.gl,.help-dot');if(g){if(tipFor===g)hideTip();else showTip(g);return}if(!t.closest||!t.closest('#gltip'))hideTip()});

/* ---------- rodapé e exportar/importar ---------- */
(function renderFooter(){
  const secs=[];
  if(M.verification&&M.verification.length)secs.push(['verif','Verificação cruzada',M.verification.map(x=>`<li>${esc(x)}</li>`).join('')]);
  if(DATA.refs&&Object.keys(DATA.refs).length)secs.push(['refs','Referências consultadas',Object.values(DATA.refs).map(d=>`<li>${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.src||d.t)}</a>`:esc(d.src||d.t)}${d.year?' ('+esc(d.year)+')':''} · ${esc(d.t)}</li>`).join('')]);
  if(DATA.sources&&Object.keys(DATA.sources).length)secs.push(['srcs','Material usado',Object.values(DATA.sources).map(s=>`<li>${esc(s)}</li>`).join('')]);
  if(M.history&&M.history.length)secs.push(['hist','Histórico de revisões',M.history.map(x=>`<li><b>${esc(x[0])}</b> (${esc(x[1])}): ${esc(x[2])}</li>`).join('')]);
  $('foot').innerHTML=`<div class="foot-bar"><span>${revStr?esc(revStr):''}</span><div class="foot-links"><button type="button" class="foot-link" id="exp">Exportar progresso</button><button type="button" class="foot-link" id="imp">Importar progresso</button>${secs.map(([id,lbl])=>`<button type="button" class="foot-link" data-fmod="${id}">${esc(lbl)}</button>`).join('')}<input type="file" id="impf" accept="application/json" hidden></div></div>`;
  const hm=$('histmodal'),ht=$('hm-t'),hl=$('hm-list'),hx=$('hm-x');
  if(hm&&hl){
    if(hx)hx.onclick=()=>{hm.hidden=true};
    hm.onclick=e=>{if(e.target===hm)hm.hidden=true};
    $('foot').querySelectorAll('[data-fmod]').forEach(b=>b.onclick=()=>{
      const s=secs.find(x=>x[0]===b.dataset.fmod);if(!s)return;
      if(ht)ht.textContent=s[1];hl.innerHTML=s[2];hm.hidden=false;if(hx)hx.focus();
    });
  }
  $('exp').onclick=()=>{const o={};['cfg','cfgD','hist','wrong','flash','feyn','study','cheat','disc'].forEach(k=>o[k]=load(k,null));
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({key:M.storageKey,data:o})],{type:'application/json'}));a.download=`progresso-${M.storageKey}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  $('imp').onclick=()=>$('impf').click();
  $('impf').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
    if(j.key!==M.storageKey)throw new Error('outro site');Object.entries(j.data).forEach(([k,v])=>{if(v!==null)store(k,v)});toast('Progresso importado');setTimeout(()=>location.reload(),900)}catch(err){toast('Arquivo inválido para este site')}};r.readAsText(file)};
})();

route();
</script>
